name: Commit lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: commitlint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Required: it checks the PR's title,
  # which with squash merge means the commit on main
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}   
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose

  audit-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0         
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Lint commits that landed on main
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: npx --no -- commitlint --from "$BEFORE" --to "$AFTER" --verbose